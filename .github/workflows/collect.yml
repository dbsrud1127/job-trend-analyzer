# 워크플로 이름 (GitHub Actions 탭에 이 이름으로 보임)
name: collect

# 언제 실행할지
on:
  schedule:
    - cron: "0 0 * * *"      # 매일 UTC 00:00 = 한국시간 09:00
  workflow_dispatch:          # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 허용

jobs:
  collect:                    # 작업 이름 (아무 이름이나 가능)
    runs-on: ubuntu-latest    # GitHub이 빌려주는 리눅스 서버에서 실행
    timeout-minutes: 10       # 10분 넘으면 강제 종료 (무한 대기 방지)

    steps:
      - uses: actions/checkout@v4          # 내 레포 코드를 서버로 내려받기

      - uses: actions/setup-python@v5      # 파이썬 설치
        with:
          python-version: "3.11"           # 로컬과 같은 버전
          cache: pip                       # 설치한 패키지를 저장해 다음 실행을 빠르게

      - name: Install packages
        run: pip install -r requirements.txt   # 로컬과 같은 패키지 설치

      - name: Run collector
        run: python collector/main.py          # 로컬과 같은 실행 명령 (루트 기준)
        env:                                   # .env 대신 GitHub Secrets에서 DB 정보 주입
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}